
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { display: flex; justify-content: center; padding: 2rem; background: #F0F4F3; border-radius: 20px; font-family: 'Figtree', sans-serif; }
.phone { width: 375px; height: 812px; background: #F7F9F8; border-radius: 44px; overflow: hidden; border: 10px solid #1a1a1a; position: relative; display: flex; flex-direction: column; }
.status-bar { background: #fff; padding: 18px 24px 0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #1a1a1a; flex-shrink: 0; }
.notch { width: 120px; height: 28px; background: #1a1a1a; border-radius: 0 0 18px 18px; position: absolute; top: 0; left: 50%; transform: translateX(-50%); }

/* background blurred screen */
.bg-screen { flex: 1; padding: 20px 16px; overflow: hidden; filter: blur(2.5px); opacity: 0.55; }
.bg-header { background: #fff; border-radius: 14px; height: 72px; margin-bottom: 10px; }
.bg-btn { background: #1D9E75; border-radius: 14px; height: 52px; margin-bottom: 10px; }
.bg-card { background: #fff; border-radius: 14px; height: 80px; margin-bottom: 10px; border: 1px solid #E8EFED; }
.bg-card-sm { background: #fff; border-radius: 14px; height: 56px; margin-bottom: 10px; border: 1px solid #E8EFED; }
.bg-label { background: #E8EFED; border-radius: 6px; height: 12px; width: 120px; margin-bottom: 10px; }

/* modal */
.modal-overlay { position: absolute; inset: 0; background: rgba(13,31,26,0.55); display: flex; align-items: flex-end; z-index: 10; }
.modal-sheet { background: #fff; border-radius: 28px 28px 0 0; padding: 0 24px 40px; width: 100%; }
.modal-handle { width: 40px; height: 5px; background: #E8EFED; border-radius: 3px; margin: 14px auto 24px; }
.modal-icon-wrap { width: 72px; height: 72px; border-radius: 22px; background: #FFF3E0; border: 1.5px solid #FDEBC8; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
.modal-title { font-size: 20px; font-weight: 700; color: #0D1F1A; text-align: center; margin-bottom: 10px; }
.modal-sub { font-size: 14px; color: #6B8A82; text-align: center; line-height: 1.65; margin-bottom: 28px; }
.modal-sub strong { color: #0D1F1A; font-weight: 600; }
.modal-highlight { background: #FFF8F0; border-radius: 10px; padding: 10px 14px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.modal-highlight-text { font-size: 12px; color: #854F0B; line-height: 1.5; }
.btn-primary { height: 54px; background: #1D9E75; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: 700; gap: 10px; margin-bottom: 12px; }
.btn-secondary { height: 54px; border: 1.5px solid #E8EFED; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #6B8A82; font-size: 15px; font-weight: 600; gap: 8px; }
</style>

<div class="wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span style="display:flex;gap:5px;align-items:center;">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#1a1a1a"/><rect x="4" y="2.5" width="3" height="9.5" rx="1" fill="#1a1a1a"/><rect x="8" y="1" width="3" height="11" rx="1" fill="#1a1a1a"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1a1a1a" stroke-opacity="0.35"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#1a1a1a"/></svg>
      </span>
    </div>

    <div class="bg-screen">
      <div class="bg-label"></div>
      <div class="bg-header"></div>
      <div class="bg-btn"></div>
      <div class="bg-card"></div>
      <div class="bg-card-sm"></div>
      <div class="bg-card-sm"></div>
      <div class="bg-label" style="width:80px;"></div>
      <div class="bg-card" style="height:60px;"></div>
    </div>

    <div class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>

        <div class="modal-icon-wrap">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#BA7517" stroke-width="1.8" stroke-linecap="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="#BA7517"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </div>

        <div class="modal-title">No sensor connected</div>
        <div class="modal-sub">
          You're about to start your session <strong>without the LIMBS sensor.</strong><br>
          Motion data and ROM will not be recorded automatically.
        </div>

        <div class="modal-highlight">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BA7517" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div class="modal-highlight-text">You can still log pain, reps and notes manually. Connect the sensor for full motion tracking.</div>
        </div>

        <div class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="white"/>
          </svg>
          Connect sensor
        </div>

        <div class="btn-secondary">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B8A82" stroke-width="2" stroke-linecap="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Continue without sensor
        </div>

      </div>
    </div>

  </div>
</div>
